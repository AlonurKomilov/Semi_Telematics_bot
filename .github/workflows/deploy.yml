# ─────────────────────────────────────────────────────────
#  Semi Telematics Bot — CI/CD Pipeline
#  Push to main → test → build → deploy
# ─────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Test ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    # The suite is Postgres-only.  Without a reachable database the
    # ``pg_db`` fixture calls ``pytest.skip`` (tests/conftest.py), so
    # ~132 of 277 test files turned into no-ops here while the build
    # stayed green — which is how nineteen failures and two live
    # production bugs accumulated unseen.  POSTGRES_TEST_URL is the path
    # conftest.py already documents for CI; it needs no testcontainers
    # and no Docker socket inside the test process.
    env:
      POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Started as a step, not a `services:` container, because the
      # server FLAGS below are not settable on a service container and
      # two of them are load-bearing:
      #   max_locks_per_transaction — every xdist worker resets its
      #     schema with DROP SCHEMA … CASCADE over ~200 objects, and
      #     eight of those against one server exhaust the shared lock
      #     table ("out of shared memory").  The testcontainers path
      #     never hit this because each worker got its own SERVER.
      #   fsync/synchronous_commit/full_page_writes — throwaway data, so
      #     durability buys nothing and costs real minutes on a suite
      #     this size.
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=test -p 5432:5432 postgres:16-alpine \
            -c max_locks_per_transaction=1024 -c fsync=off \
            -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 60); do
            docker exec ci-postgres pg_isready -U postgres && break
            sleep 1
          done

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dashboard deps
        run: cd interfaces/dashboard && (npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts)

      # Dashboard pre-flight: drift guard catches stray persona literals
      # outside useShellConfig, tsc catches type breaks, then the build
      # itself catches Vite-time failures.  All three must pass before
      # the Docker image ships.
      - name: Dashboard — role-drift guard
        run: cd interfaces/dashboard && npm run check:role-drift

      - name: Dashboard — type check
        run: cd interfaces/dashboard && npx tsc --noEmit

      # The lint ratchet only ratchets if something pulls it. It had sat
      # at --max-warnings=52 against a real count of 267, so the script
      # exited 1 on a clean checkout and no one noticed — nothing ran it.
      - name: Dashboard — lint ratchet
        run: cd interfaces/dashboard && npm run lint

      - name: Dashboard — Vitest smoke
        run: cd interfaces/dashboard && npm test

      - name: Dashboard — production build
        run: cd interfaces/dashboard && npm run build

      # No ``-x``.  It stopped at the FIRST failure, so a single
      # collection error hid every failure behind it — eighteen of them,
      # for about three weeks.  Fail on all of them at once instead.
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=short | tee /tmp/pytest-summary.txt

      # A skipped test and a passing test look identical in a green
      # build.  This is the guard that makes the two distinguishable —
      # without it, the Postgres step above could break tomorrow and the
      # suite would go quiet again with nothing turning red.
      - name: Guard — the database suite actually ran
        if: always()
        env:
          MAX_SKIPPED: "40"
        run: |
          if [ ! -f /tmp/pytest-summary.txt ]; then
            echo "::error::pytest produced no summary — the run did not complete"
            exit 1
          fi
          skipped=$(grep -oE '[0-9]+ skipped' /tmp/pytest-summary.txt \
                    | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "skipped=$skipped ceiling=$MAX_SKIPPED"
          if [ "$skipped" -gt "$MAX_SKIPPED" ]; then
            echo "::error::$skipped tests skipped (ceiling $MAX_SKIPPED). The pg_db"
            echo "::error::fixture skips itself when Postgres is unreachable, so this"
            echo "::error::usually means the service container or POSTGRES_TEST_URL broke."
            exit 1
          fi

      - name: Type check (mypy)
        run: python -m mypy interfaces/api/ interfaces/bot/app.py run.py --ignore-missing-imports --no-error-summary
        continue-on-error: true

      # Existing lint debt across interfaces/api/routes (E501 line-too-long,
      # a few F841/E221/E272) predates this CI fix and is tracked as a
      # separate cleanup.  continue-on-error matches mypy so violations
      # are reported on PRs without blocking the build.  Remove the flag
      # once the debt is cleared.
      - name: Lint (flake8)
        run: python -m flake8 interfaces/api/ --max-line-length=120 --exclude=__pycache__
        continue-on-error: true

  # ── 2. Build & Push Docker Image ────────────────────
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 3. Deploy to Server ─────────────────────────────
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull latest image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull bot

            # Restart with zero downtime
            docker compose up -d --no-deps bot

            # Wait for health check
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed"
                exit 0
              fi
              sleep 2
            done
            echo "❌ Health check failed after 60s"
            docker compose logs --tail=50 bot
            exit 1

  # ── 4. Post-deploy host smoke ───────────────────────
  # Hits each public hostname (dash/fleet/dispatch/safety/app/api/bot
  # + apex) and verifies it responds the way nginx says it should.
  # Persona subdomains are flagged as soft failures so a missing DNS
  # record doesn't block a healthy deploy of the rest — pass --strict
  # to fail on those too once DNS is fully provisioned.
  verify-hosts:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-check all public hostnames
        run: node interfaces/dashboard/scripts/check-hosts.mjs

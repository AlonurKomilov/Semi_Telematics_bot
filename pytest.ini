[pytest]
asyncio_mode = auto

# ONE definition of "the suite", and nothing else may name a path.
#
# Tests are migrating out of this flat directory and into the package
# that owns them (features/<x>/tests/, capabilities/<x>/tests/).  A
# command line that names `tests/` therefore silently NARROWS the run as
# the migration proceeds: it still exits 0 while collecting less and
# less.  A probe proved it — a test placed in features/parking/tests/ is
# collected by neither `pytest` nor `pytest tests/` until this line
# changes, and the build stays green with a shrinking suite.
#
# interfaces/ is deliberately absent: nothing moves there, and naming it
# would drag three node_modules and three dist trees into every
# collection.  Its tests stay under tests/interfaces/.
testpaths = tests features capabilities adapters interfaces infra

# norecursedirs REPLACES pytest's built-in default
# (*.egg .* _darcs build CVS dist node_modules venv {arch}) — every
# entry still wanted has to be repeated here or it stops applying.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} data backups htmlcov

pythonpath = .
# --dist loadfile: every test in a FILE runs on one worker, in
# collection order.  xdist's default (`load`) hands each test to
# whichever worker frees up first, so a file's tests scatter and the
# order changes run to run -- which is how a leak between two tests
# in one file shows up once in five runs and passes the other four.
# Three such leaks were found by hand; this makes the next one
# reproducible instead of a coin flip.  Cross-FILE co-location still
# varies: that is what the global-state isolation work addresses.
addopts = -v --tb=short -n auto --dist loadfile

# Redis configuration for Semi Telematics Bot
# Runs on port 8002 to avoid conflict with other projects (6379)

port 8002
bind 127.0.0.1
daemonize no

# Persistence
dir /home/abcdev/projects/Semi_Telematics_bot/data
dbfilename redis-8002.rdb
save 900 1
save 300 10
save 60 10000

# Memory
maxmemory 128mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Security — bind to localhost only, no password needed
protected-mode yes

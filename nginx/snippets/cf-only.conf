# /etc/nginx/snippets/cf-only.conf — refuse connections that did not arrive via Cloudflare.
# 444 = close without a response: a direct-to-origin probe learns nothing, not even that a
# vhost exists here. $from_cloudflare comes from conf.d/cloudflare-realip.conf.
if ($from_cloudflare = 0) { return 444; }

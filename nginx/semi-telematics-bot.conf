# NGINX reverse proxy for Semi Telematics Bot webhook mode
#
# Install:
#   sudo cp nginx/semi-telematics-bot.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/semi-telematics-bot.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d YOUR_DOMAIN
#
# Replace YOUR_DOMAIN and YOUR_WEBHOOK_SECRET below.

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # Let's Encrypt will fill these automatically via certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Only accept the webhook path with the secret token
    location /webhook {
        proxy_pass http://127.0.0.1:8443/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Telegram sends small JSON payloads — limit body size
        client_max_body_size 1m;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Deny everything else
    location / {
        return 404;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# NGINX reverse proxy for Semi Telematics Bot — 4truck.us
#
# Port layout:
#   8000 — FastAPI API + static files (miniapp, dashboard)
#   8001 — Telegram webhook listener
#
# IMPORTANT: This file is for 4truck.us ONLY.
# Other projects (2bot.org, analyticbot.org) have their own configs.
# Do NOT add a catch-all default server — it may break other sites.
#
# Install:
#   make nginx-install
#
# SSL: Self-signed cert for Cloudflare Full mode.
#   For Full (Strict), replace with Cloudflare Origin CA certificate:
#   Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
#   Save to /etc/nginx/ssl/4truck.crt and /etc/nginx/ssl/4truck.key

# ── Upstreams ────────────────────────────────────
# Phase 2: API now runs N gunicorn/uvicorn workers behind a single TCP
# port. ``keepalive 32`` reuses up to 32 idle connections, eliminating
# the per-request TCP handshake under sustained traffic.
upstream 4truck_api {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

upstream 4truck_webhook {
    server 127.0.0.1:8001;
    keepalive 4;
}

# ── HTTPS (443) ──────────────────────────────────
server {
    listen 443 ssl;
    server_name 4truck.us;

    # Cloudflare origin certificate (Full mode)
    # Replace with Cloudflare Origin CA cert for Full (Strict) mode:
    #   Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    # ── Security headers (server-level defaults; locations that set
    # their own add_header must repeat these — nginx drops inherited
    # add_header the moment a location defines one).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Telegram webhook
    location /webhook {
        proxy_pass http://4truck_webhook/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # AI endpoints — longer timeout for Gemini agent round-trips.
    # HTTP/1.1 + empty Connection header required for upstream keepalive.
    location /api/ai/ {
        proxy_pass http://4truck_api/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 5m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    # Safety scorecard — heavier computation, needs a longer read timeout
    location /api/safety/ {
        proxy_pass http://4truck_api/api/safety/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 5m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    # FastAPI API endpoints.  90s read timeout matches the dashboard's
    # apiJSONSlow client and the cold-cache report path.  25m body cap
    # accommodates the largest legitimate upload (driver documents,
    # 20 MB + multipart overhead); the FastAPI LimitBodyMiddleware keeps
    # non-upload paths capped at 2 MB.
    location /api/ {
        proxy_pass http://4truck_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    # ── Phase 4 (Cloudflare/CDN cache rules) ────────────────────
    # Hashed Vite bundles cache forever; shell HTML caches 60s with
    # stale-while-revalidate. See docs/runbooks/cdn-rollout.md.

    # Telegram Mini App / standalone web app.  Loaded inside Telegram's
    # WebView iframe — CSP frame-ancestors must allow web.telegram.org.
    # X-Frame-Options is intentionally OMITTED (ALLOW-FROM syntax is
    # deprecated; CSP frame-ancestors is the modern equivalent).
    location ~ ^/app/assets/ {
        proxy_pass http://4truck_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }
    location = /app/index.html {
        proxy_pass http://4truck_api/app/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }
    location /app/ {
        proxy_pass http://4truck_api/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }

    # Desktop dashboard (React SPA)
    location ~ ^/dashboard/assets/ {
        proxy_pass http://4truck_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location = /dashboard/index.html {
        proxy_pass http://4truck_api/dashboard/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location /dashboard/ {
        proxy_pass http://4truck_api/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny everything else on this domain
    location / {
        return 404;
    }
}

# ── HTTP → HTTPS redirect ────────────────────────
# NOTE: Only for 4truck.us. Do NOT add a default_server
# directive — other projects handle their own HTTP blocks.
server {
    listen 80;
    server_name 4truck.us;
    return 301 https://$host$request_uri;
}

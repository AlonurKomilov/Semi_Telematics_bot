# NGINX reverse proxy for 4truck — 4truck.us
#
# Port layout:
#   8000 — FastAPI API + static files (miniapp, dashboard)
#   8001 — Telegram webhook listener
#
# IMPORTANT: This file is for 4truck.us ONLY.
# Other projects (2bot.org, analyticbot.org) have their own configs.
# Do NOT add a catch-all default server — it may break other sites.
#
# Install:
#   make nginx-install
#
# SSL: Self-signed cert for Cloudflare Full mode.
#   For Full (Strict), replace with Cloudflare Origin CA certificate:
#   Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
#   Save to /etc/nginx/ssl/4truck.crt and /etc/nginx/ssl/4truck.key

# ── Upstreams ────────────────────────────────────
# Phase 2: API now runs N gunicorn/uvicorn workers behind a single TCP
# port, so the upstream still has one ``server`` line — the OS load-
# balances incoming connections across workers via SO_REUSEPORT.
# ``keepalive 32`` reuses up to 32 idle connections per worker process,
# eliminating the per-request TCP handshake between nginx and gunicorn
# under sustained traffic.
upstream 4truck_api {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

# When a deploy rotates Vite's content-hashed bundles, clients with a
# stale ``index.html`` cached in the browser request asset filenames
# that no longer exist on disk and get a 404 from FastAPI.  We must NOT
# tell the browser to cache that 404 forever, otherwise the page stays
# wedged even after the user reloads.  The dashboard's runtime catches
# the import failure and reloads; nginx's job here is to ensure the
# 404 isn't itself cached.  Map flips the Cache-Control header based
# on response status: 200/304 → year + immutable; anything else →
# no-store so the next try re-hits FastAPI.
map $upstream_status $dashboard_asset_cache {
    default               "no-store, must-revalidate";
    ~^2                   "public, max-age=31536000, immutable";
    304                   "public, max-age=31536000, immutable";
}

# Same idea but for the dash./app. subdomains where assets are served
# directly from disk by nginx (no upstream).  ``$status`` is the local
# response status, so a 404 (stale hash after deploy) flips to
# no-store and the browser re-fetches on next reload instead of caching
# the dead URL.
map $status $static_asset_cache {
    default               "no-store, must-revalidate";
    "200"                 "public, max-age=31536000, immutable";
    "304"                 "public, max-age=31536000, immutable";
}

upstream 4truck_webhook {
    server 127.0.0.1:8001;
    keepalive 4;
}

# ── HTTPS: www.4truck.us → 4truck.us (canonical non-www) ─────
# The apex is the canonical host; ``www.`` is just an alias for users
# who type the prefix out of habit.  301-redirecting to the bare apex
# keeps the URL consistent, avoids splitting analytics across two
# hostnames, and lets SEO consolidate on one canonical.
#
# Wildcard ``*.4truck.us`` cert covers www., so no separate cert work
# is needed.  Cloudflare must have a DNS record for ``www`` pointing
# at this origin (typically a CNAME to ``4truck.us``).
server {
    listen 443 ssl;
    server_name www.4truck.us;

    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    return 301 https://4truck.us$request_uri;
}

# ── HTTPS (443) ──────────────────────────────────
server {
    listen 443 ssl;
    server_name 4truck.us;

    # Cloudflare origin certificate (Full mode)
    # Replace with Cloudflare Origin CA cert for Full (Strict) mode:
    #   Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    # ── Security headers (apply to locations that have no add_header
    # of their own — nginx drops ALL inherited add_header directives
    # the moment a location defines even one, so the same six lines are
    # duplicated in every location with a Cache-Control directive).
    #
    # X-Frame-Options / CSP frame-ancestors default to deny.  The
    # /miniapp/* locations override frame-ancestors to allow Telegram
    # WebView to embed the Mini App; nothing else is framed anywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Telegram webhook
    location /webhook {
        proxy_pass http://4truck_webhook/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # AI endpoints — longer timeout for Gemini agent round-trips
    location /api/ai/ {
        proxy_pass http://4truck_api/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 5m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;

        # Hide brief 502/503/504 during ``make restart-api`` (gunicorn
        # arbiter takes ~3-5s to release + rebind the socket).  nginx
        # retries the same upstream up to 3 times within 30s; by then
        # gunicorn is back and the user sees data, not an error.
        # ``non_idempotent`` is INTENTIONALLY OMITTED — POST/PATCH/DELETE
        # are not retried (preserves idempotency).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # Public legal pages — Privacy Policy and Terms of Service.
    # Served at the apex of the domain (https://4truck.us/privacy,
    # /terms) because Google OAuth verification expects the URLs in the
    # consent screen to be reachable without any /api or /dashboard
    # prefix. FastAPI serves the static HTML at these exact paths.
    location = /privacy {
        proxy_pass http://4truck_api/privacy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location = /terms {
        proxy_pass http://4truck_api/terms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # FastAPI API endpoints
    # proxy_read_timeout=90s matches the dashboard's `apiJSONSlow` client
    # timeout. Heavy endpoints (scorecards, reports, exports) can legitimately
    # take 30-60s on cold cache when Samsara fan-out is slow; capping nginx
    # at the previous 30s caused 504s before the cold path could finish.
    # The new SWR cache layer keeps the slow path off the request path for
    # subsequent users, but the first cold request still needs the headroom.
    #
    # HTTP/1.1 + empty Connection header is required for the upstream
    # ``keepalive 32`` directive to actually reuse connections.  Without
    # these two headers nginx opens a new TCP socket to gunicorn on every
    # request — defeats the keepalive pool.
    #
    # ``client_max_body_size 25m`` is sized for the largest legitimate
    # upload (driver documents at 20 MB, plus multipart-form overhead).
    # The FastAPI ``LimitBodyMiddleware`` keeps a 2 MB cap on every
    # non-upload path so a malicious 20 MB JSON payload still 413s at
    # the app layer.
    location /api/ {
        proxy_pass http://4truck_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;

        # See /api/ai/ block — silently retries during ``make restart-api``
        # so users don't see 502s in the ~5s window while gunicorn reboots.
        # Idempotent verbs only (GET/HEAD); POST/PATCH/DELETE fall through
        # to the client so writes are never duplicated by nginx.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # ── Phase 4 (Cloudflare/CDN cache rules) ─────────────────────
    # Vite emits hashed asset filenames (Foo-DDR_o27E.js), so the
    # /assets/ path is **content-addressed** and safe to cache forever.
    # The shell index.html stays nearly fresh (60s) so deploys propagate
    # within a minute; stale-while-revalidate gives a 5-minute window
    # where users get the cached shell while Cloudflare refetches.
    #
    # We set the headers at the origin so Cloudflare honors them
    # automatically — no Page Rules needed for the cache lifetime,
    # only for the "bypass /api/" rule documented in the runbook.

    # ── Legacy path redirects (apex → dedicated subdomain) ─────
    # The Mini App and dashboard moved to app.4truck.us / dash.4truck.us
    # respectively.  These 301s catch existing bookmarks, deep links
    # shared in chats, and Telegram WebView caches that still point at
    # the apex.  Strip the legacy prefix so the deep link survives:
    # /dashboard/fleet/vehicles → https://dash.4truck.us/fleet/vehicles.
    location ~ ^/miniapp/(.*)$ {
        return 301 https://app.4truck.us/$1;
    }
    location = /miniapp {
        return 301 https://app.4truck.us/;
    }
    location ~ ^/dashboard/(.*)$ {
        return 301 https://dash.4truck.us/$1;
    }
    location = /dashboard {
        return 301 https://dash.4truck.us/;
    }

    # Telegram WebView auto-requests /favicon.ico at the document root.
    # The miniapp uses an inline SVG data-URI for the in-page icon, so we
    # don't ship a real .ico file.  Return 204 No Content instead of 404
    # so the console stays clean.  Keep this above the catch-all 404.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Apex landing page — required for Google OAuth verification.
    # Reviewers visit https://4truck.us/ as the "App home page" URL
    # declared in the consent screen, so this MUST serve human-readable
    # content rather than 404.  FastAPI returns ``static/landing/index.html``.
    location = / {
        proxy_pass http://4truck_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Apex auth surface — single canonical entry point for every
    # persona.  The dashboard SPA renders /login, /forgot-password,
    # /reset-password, and /verify-email here; after a successful auth
    # the SPA reads the user's role and redirects to the matching
    # persona subdomain (fleet./dispatch./safety./dash.).  The
    # auth_token cookie set by /api/auth/* is scoped to .4truck.us so
    # the redirect target trusts the same session.
    #
    # Why apex and not dash.?
    #   1. Telegram Login Widget allows ONE configured domain per bot.
    #   2. Password-reset / email-verification links shipped via Resend
    #      need a role-neutral URL — a Fleet user shouldn't see
    #      "dash." in their inbox.  The apex makes the email link
    #      identical for every persona.
    location ~ ^/(login|forgot-password|reset-password|verify-email)$ {
        root /home/abcdev/projects/Semi_Telematics_bot/interfaces/dashboard/dist;
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Apex must serve the SPA's hashed assets too, otherwise /login
    # loads ``index.html`` but the JS bundle 404s.  Content-addressed,
    # safe to cache forever.
    location ~ ^/assets/ {
        root /home/abcdev/projects/Semi_Telematics_bot/interfaces/dashboard/dist;
        try_files $uri =404;
        add_header Cache-Control $static_asset_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Deny everything else on this domain.  The catch-all stays as 404
    # so probes for unknown paths (/admin, /wp-login, etc.) don't leak
    # backend errors or hit the API.
    location / {
        return 404;
    }
}

# ── HTTPS: dash.4truck.us (+ persona subdomains) — Desktop Dashboard
# All persona hostnames serve the SAME React SPA bundle.  RoleViewContext
# inspects window.location.hostname on first load and pre-selects the
# matching view (fleet → Fleet, dispatch → Dispatch, safety → Safety) so
# operators landing on a branded URL get the persona-tuned shell without
# a click.  Wildcard *.4truck.us cert covers them all.
server {
    listen 443 ssl;
    server_name dash.4truck.us fleet.4truck.us dispatch.4truck.us safety.4truck.us hr.4truck.us accounting.4truck.us;

    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    # Static SPA built by `make dashboard-build` lives here on disk.
    # nginx serves it directly; FastAPI is reached only via /api/ below.
    root /home/abcdev/projects/Semi_Telematics_bot/interfaces/dashboard/dist;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # API — same-origin proxy keeps the dashboard's apiFetch('/api/...')
    # working without any CORS friction.
    location /api/ {
        proxy_pass http://4truck_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # Hashed Vite bundles — content-addressed, safe to cache forever
    # on 2xx, never on 404 (post-deploy hash rotation).
    location ~ ^/assets/ {
        try_files $uri =404;
        add_header Cache-Control $static_asset_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # SPA shell — short cache + stale-while-revalidate so deploys
    # propagate within a minute.  try_files lets React Router handle
    # any path that isn't a real file (e.g. /fleet/vehicles).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}

# ── HTTPS: app.4truck.us — Telegram Mini App (React SPA PWA) ──
server {
    listen 443 ssl;
    server_name app.4truck.us;

    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    root /home/abcdev/projects/Semi_Telematics_bot/interfaces/miniapp/dist;

    # frame-ancestors must allow Telegram WebView (the parent iframe is
    # web.telegram.org).  X-Frame-Options intentionally omitted — its
    # ALLOW-FROM syntax is deprecated; modern browsers honor CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;

    location /api/ {
        proxy_pass http://4truck_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    location ~ ^/assets/ {
        try_files $uri =404;
        add_header Cache-Control $static_asset_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }
}

# ── HTTPS: api.4truck.us — Pure FastAPI ──────────────────────
# Clean URLs (api.4truck.us/v1/users/me → /api/v1/users/me) for direct
# API consumers; the dashboard + miniapp keep using their own /api/
# same-origin proxy so they don't see this hostname at all.
server {
    listen 443 ssl;
    server_name api.4truck.us;

    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Strip the leading slash so / maps to FastAPI's /api/ root.
    location / {
        proxy_pass http://4truck_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }
}

# ── HTTPS: bot.4truck.us — Telegram webhook listener ─────────
server {
    listen 443 ssl;
    server_name bot.4truck.us;

    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Telegram POSTs updates here.  Per-account bots can use webhook
    # subpaths (/webhook/{account_id}) — handled by the prefix match.
    location /webhook {
        proxy_pass http://4truck_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Everything else on bot.4truck.us is invalid — no leak surface.
    location / {
        return 404;
    }
}

# ── HTTP → HTTPS redirect (all hostnames) ────────────────────
# NOTE: Other projects (2bot.org, analyticbot.org) own their own port-80
# blocks.  Do NOT add a default_server directive here.
server {
    listen 80;
    server_name 4truck.us www.4truck.us
                dash.4truck.us app.4truck.us api.4truck.us bot.4truck.us
                fleet.4truck.us dispatch.4truck.us safety.4truck.us
                hr.4truck.us accounting.4truck.us
                system.4truck.us;
    return 301 https://$host$request_uri;
}

# ── HTTPS: system.4truck.us — operator-only console ──────────
# Mirror of the dash.4truck.us layout but:
#   - serves the separate operator-only SPA bundle (no customer code)
#   - intended to sit behind Cloudflare WAF + IP allowlist so only the
#     project owners' IPs ever reach the origin
#   - same /api/ proxy so the SPA can call /api/system/* with a Bearer
#     token issued by /api/auth/telegram-login.  The server-side
#     ``require_system_owner`` dep is the actual access gate; this
#     vhost just isolates the JS bundle from the customer surface.
server {
    listen 443 ssl;
    server_name system.4truck.us;

    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    root /home/abcdev/projects/Semi_Telematics_bot/interfaces/system_dashboard/dist;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Operator dashboard must never be indexed.  Defense-in-depth on
    # top of the noindex meta tag in index.html.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://4truck_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 5m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    location ~ ^/assets/ {
        try_files $uri =404;
        add_header Cache-Control $static_asset_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

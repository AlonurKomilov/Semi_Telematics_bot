# NGINX reverse proxy for 4truck — 4truck.us
#
# Port layout:
#   8000 — FastAPI API + static files (miniapp, dashboard)
#   8001 — Telegram webhook listener
#
# IMPORTANT: This file is for 4truck.us ONLY.
# Other projects (2bot.org, analyticbot.org) have their own configs.
# Do NOT add a catch-all default server — it may break other sites.
#
# Install:
#   make nginx-install
#
# SSL: Self-signed cert for Cloudflare Full mode.
#   For Full (Strict), replace with Cloudflare Origin CA certificate:
#   Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
#   Save to /etc/nginx/ssl/4truck.crt and /etc/nginx/ssl/4truck.key

# ── Upstreams ────────────────────────────────────
# Phase 2: API now runs N gunicorn/uvicorn workers behind a single TCP
# port, so the upstream still has one ``server`` line — the OS load-
# balances incoming connections across workers via SO_REUSEPORT.
# ``keepalive 32`` reuses up to 32 idle connections per worker process,
# eliminating the per-request TCP handshake between nginx and gunicorn
# under sustained traffic.
upstream 4truck_api {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

upstream 4truck_webhook {
    server 127.0.0.1:8001;
    keepalive 4;
}

# ── HTTPS (443) ──────────────────────────────────
server {
    listen 443 ssl;
    server_name 4truck.us;

    # Cloudflare origin certificate (Full mode)
    # Replace with Cloudflare Origin CA cert for Full (Strict) mode:
    #   Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
    ssl_certificate     /etc/nginx/ssl/4truck.crt;
    ssl_certificate_key /etc/nginx/ssl/4truck.key;

    # Telegram webhook
    location /webhook {
        proxy_pass http://4truck_webhook/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # AI endpoints — longer timeout for Gemini agent round-trips
    location /api/ai/ {
        proxy_pass http://4truck_api/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 5m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    # FastAPI API endpoints
    # proxy_read_timeout=90s matches the dashboard's `apiJSONSlow` client
    # timeout. Heavy endpoints (scorecards, reports, exports) can legitimately
    # take 30-60s on cold cache when Samsara fan-out is slow; capping nginx
    # at the previous 30s caused 504s before the cold path could finish.
    # The new SWR cache layer keeps the slow path off the request path for
    # subsequent users, but the first cold request still needs the headroom.
    #
    # Phase 2: HTTP/1.1 + empty Connection header is required for the
    # upstream ``keepalive 32`` directive to actually reuse connections.
    # Without these two headers nginx opens a new TCP socket to gunicorn
    # on every request — defeats the keepalive pool.
    location /api/ {
        proxy_pass http://4truck_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 5m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    # ── Phase 4 (Cloudflare/CDN cache rules) ─────────────────────
    # Vite emits hashed asset filenames (Foo-DDR_o27E.js), so the
    # /assets/ path is **content-addressed** and safe to cache forever.
    # The shell index.html stays nearly fresh (60s) so deploys propagate
    # within a minute; stale-while-revalidate gives a 5-minute window
    # where users get the cached shell while Cloudflare refetches.
    #
    # We set the headers at the origin so Cloudflare honors them
    # automatically — no Page Rules needed for the cache lifetime,
    # only for the "bypass /api/" rule documented in the runbook.

    # ── Telegram Mini App (React SPA built from interfaces/miniapp) ─

    # Hashed asset bundles — cache forever
    location ~ ^/miniapp/assets/ {
        proxy_pass http://4truck_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Shell HTML — short cache + stale-while-revalidate
    location = /miniapp/index.html {
        proxy_pass http://4truck_api/miniapp/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
    }

    location /miniapp/ {
        proxy_pass http://4truck_api/miniapp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Desktop dashboard (React SPA) ───────────────────────────

    # Hashed asset bundles — cache forever
    location ~ ^/dashboard/assets/ {
        proxy_pass http://4truck_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Shell HTML — short cache + stale-while-revalidate
    location = /dashboard/index.html {
        proxy_pass http://4truck_api/dashboard/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
    }

    location /dashboard/ {
        proxy_pass http://4truck_api/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram WebView auto-requests /favicon.ico at the document root.
    # The miniapp uses an inline SVG data-URI for the in-page icon, so we
    # don't ship a real .ico file.  Return 204 No Content instead of 404
    # so the console stays clean.  Keep this above the catch-all 404.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Deny everything else on this domain
    location / {
        return 404;
    }
}

# ── HTTP → HTTPS redirect ────────────────────────
# NOTE: Only for 4truck.us. Do NOT add a default_server
# directive — other projects handle their own HTTP blocks.
server {
    listen 80;
    server_name 4truck.us;
    return 301 https://$host$request_uri;
}

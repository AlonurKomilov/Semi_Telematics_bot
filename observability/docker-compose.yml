# Local dev observability stack.
#
# Brings up Prometheus + Grafana that scrape the API on localhost:8000.
# For prod use a managed Grafana / k8s helm chart instead — this file
# is for local validation that the metrics actually appear.
#
# Run:
#   cd observability && docker compose up -d
#   open http://localhost:3000  (admin/admin)
#   open http://localhost:9090  (Prometheus targets page)

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: 4truck-prometheus
    network_mode: host  # so prometheus can reach localhost:8000 (the API)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"   # POST /-/reload to hot-reload rules

  grafana:
    image: grafana/grafana:latest
    container_name: 4truck-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Auto-provision Prometheus as the default datasource.
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:

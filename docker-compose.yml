services:
  bot:
    build: .
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:8002/0
    ports:
      - "8000:8000"    # FastAPI API
      - "8001:8001"    # Telegram Webhook
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --port 8002
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8002", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4truck — Trucking Operations</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Cloudflare Turnstile script.  TurnstileWidget.tsx renders the
         actual challenge only when GET /auth/config returns a non-
         empty turnstile_site_key, so the script load is a cheap no-op
         on instances where Turnstile is disabled. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <!-- bg-gray-950 is an intentional always-dark splash so dark-theme
       users don't see a white flash before React applies the theme
       class.  text-foreground (not a raw palette) so any component
       that inherits its colour stays visible in BOTH themes — a raw
       near-white default here is what made form-input text invisible
       on the light theme. -->
  <body class="bg-gray-950 text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

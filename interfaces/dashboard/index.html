<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4truck — Trucking Operations</title>

    <!-- Pre-paint theme stamp. Must stay INLINE and FIRST: it is the only
         code that runs before the first paint, and it replaces the
         always-dark <body> splash this file used to carry. Read-only,
         hand-written, skipped on the apply host. Full rationale and the
         rules it must keep: design.md §2 "The pre-paint theme stamp";
         enforced by src/test/themeBoot.test.ts. -->
    <script id="theme-boot">
      (function () {
        // Is this the public apply host, which owns its own theme?
        // Same predicate as main.tsx. Guarded so an old engine without
        // URLSearchParams still boots the dashboard normally.
        var skip = false;
        try {
          skip = location.hostname.toLowerCase().indexOf('apply.') === 0
            || new URLSearchParams(location.search).has('apply');
        } catch (e) { skip = false; }
        if (skip) return;

        // Read never throws: a blocked store, absent key or corrupt JSON
        // all resolve to {}, and every field then falls to its default.
        // The DEFAULT IS DARK, so this must run even when storage is
        // unavailable — returning early there would hand every private-
        // mode user the light theme.
        var read = function (key) {
          try {
            var raw = localStorage.getItem(key);
            if (!raw) return null;
            var v = JSON.parse(raw);
            return (v && typeof v === 'object') ? v : null;
          } catch (e) { return null; }
        };

        // Canonical key first, then each older spelling in turn. Never
        // written back — local.ts owns the copy-forward, and this script
        // is asserted read-only by themeBoot.test.ts.
        //
        // Three names, because the key has been renamed twice: it is
        // `mods.theme` now that the service holds sound and motion as
        // well as colour, was `theme`, and before the preferences
        // service existed was `dashboard-theme`. A browser holding any
        // of them keeps its appearance through the first paint — which
        // is the whole reason this chain exists rather than a single
        // read.
        var t = read('4truck.pref.mods.theme')
             || read('4truck.pref.theme')
             || read('dashboard-theme') || {};
        var s = read('4truck.pref.mods.size')
             || read('4truck.pref.size') || {};

        var pick = function (v, allowed, fallback) {
          return allowed.indexOf(v) === -1 ? fallback : v;
        };
        var radius = pick(t.radius, ['sharp', 'rounded', 'pill'], 'rounded');
        var material = pick(t.material, ['solid', 'glass'], 'solid');
        var motion = pick(t.motion, ['calm', 'default', 'snappy'], 'default');

        // Mode and accent, with the pre-split `color` as the fallback —
        // the same migration registry.ts's sanitiser does, written a
        // second time because this script cannot import (design.md §2
        // rule 4). If the two ever disagree the first painted frame is
        // one theme and the app snaps to another after hydration;
        // themeBoot.test.ts compares them for exactly that reason.
        var LEGACY = {
          'dark-blue':   ['dark',  'blue'],
          'dark-purple': ['dark',  'purple'],
          'dark-green':  ['dark',  'green'],
          'light':       ['light', 'blue']
        };
        var mode, accent;
        if (['dark', 'light'].indexOf(t.mode) !== -1
            && ['blue', 'purple', 'green', 'azure'].indexOf(t.accent) !== -1) {
          mode = t.mode; accent = t.accent;
        } else {
          var legacy = LEGACY[t.color] || ['dark', 'blue'];
          mode = legacy[0]; accent = legacy[1];
        }

        var root = document.documentElement;
        if (mode === 'light') root.classList.remove('dark');
        else root.classList.add('dark');
        root.dataset.accent = accent;
        // Deprecated alias, still stamped for one release so anything
        // still keyed on [data-theme] keeps working.
        root.dataset.theme = mode === 'light' ? 'light' : 'dark-' + accent;
        root.dataset.radius = radius;
        root.dataset.material = material;
        root.dataset.motion = motion;

        // Size. The clamp MUST match clampSize() in preferences/registry.ts
        // — themeBoot.test.ts asserts that it does. 1 is "as designed".
        // Shrinking is safe because every pointer target carries a
        // non-scaling 24px floor (min-h-tap); 0.85 is where small TYPE
        // stops being worth reading. Rationale: registry.ts SIZE_MIN.
        var clamp = function (v) {
          var n = typeof v === 'number' ? v : Number(v);
          if (!isFinite(n)) return 1;
          return Math.min(1.5, Math.max(0.85, n));
        };
        var g = clamp(s.global);
        var axes = ['text', 'control', 'layout', 'panel'];
        for (var i = 0; i < axes.length; i++) {
          root.style.setProperty('--size-' + axes[i], String(clamp(s[axes[i]]) * g));
        }
        var regions = ['text', 'tables', 'controls', 'overlays', 'navigation', 'assistant'];
        var sr = (s.regions && typeof s.regions === 'object') ? s.regions : {};
        for (var j = 0; j < regions.length; j++) {
          if (sr[regions[j]] !== undefined) {
            root.style.setProperty('--size-region-' + regions[j], String(clamp(sr[regions[j]])));
          }
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Cloudflare Turnstile script.  TurnstileWidget.tsx renders the
         actual challenge only when GET /auth/config returns a non-
         empty turnstile_site_key, so the script load is a cheap no-op
         on instances where Turnstile is disabled. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <!-- No background literal, on purpose — the theme-boot script above
       makes index.css's `body { background-color: var(--background) }`
       correct from the first frame. text-foreground stays so inherited
       text is visible in both themes. See design.md §2. -->
  <body class="text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

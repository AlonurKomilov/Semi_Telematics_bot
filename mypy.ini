[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
no_implicit_optional = True
check_untyped_defs = False
# Don't surface errors from sibling modules in the same package when
# checking a single strict file.
disable_error_code = no-untyped-def, type-arg, no-untyped-call

# Per-file overrides: enable stricter checks where the code already complies.
[mypy-capabilities.alerting.dnd]
disallow_untyped_defs = True
warn_return_any = True
disable_error_code = no-untyped-def, type-arg, no-untyped-call, attr-defined
